name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./core/ -short -count=1

  # Full acceptance suite: runs a local control plane (testcontrol) plus a
  # local DERP/STUN relay in-process, so it needs no Tailscale credentials
  # and no Internet access beyond the Go module cache.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go test ./core/ -run TestIntegration -count=1 -timeout 15m
